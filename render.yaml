services:
  - type: web
    name: compragamer-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /exchange-rate
    envVars:
      - key: DATABASE_URL
        sync: false
      # Versión de Node (tiene que existir: "20" usa la última 20.x)
      - key: NODE_VERSION
        value: "20"
      # Dominios del frontend permitidos por CORS, separados por coma. Ej: https://craken06.github.io
      - key: CORS_ORIGINS
        sync: false
      # Login del panel de administración (única forma de usar las funciones de admin)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      # Generar con: node scripts/hash-password.js (pide la contraseña)
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Ingreso de clientes con Google: ID de cliente OAuth (el mismo que usa el sitio)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Mercado Pago (Checkout Pro). Sin MP_ACCESS_TOKEN (ni transferencia) no se pueden hacer pedidos.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      # Adónde vuelve el cliente después de pagar, y URL pública de esta API (para el webhook)
      - key: FRONTEND_URL
        value: https://auryx.com.ar
      - key: API_PUBLIC_URL
        sync: false
      # Mails (Resend). Sin RESEND_API_KEY no se envía ninguno.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: AURYX <avisos@auryx.com.ar>
      # Avisos internos: contacto@ reenvía a Gmail con Cloudflare Email Routing
      - key: NOTIFY_EMAIL
        value: contacto@auryx.com.ar
      # Transferencia bancaria (deshabilitada mientras TRANSFER_ENABLED no sea "true").
      # TRANSFER_BANK = {"holder":"…","cuit":"…","bank":"…","cbu":"…","alias":"…"}
      - key: TRANSFER_ENABLED
        sync: false
      - key: TRANSFER_BANK
        sync: false
      - key: TRANSFER_DISCOUNT_PCT
        sync: false
      - key: TRANSFER_DEADLINE_HOURS
        sync: false
      # Archivos (Cloudflare R2): comprobantes, recursos de cursos, entregas y portadas
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PRIVATE_BUCKET
        sync: false
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Videos de los cursos (Bunny Stream, con Token Authentication)
      - key: BUNNY_LIBRARY_ID
        sync: false
      - key: BUNNY_API_KEY
        sync: false
      - key: BUNNY_TOKEN_KEY
        sync: false
      # Cotización del dólar: tipo de dólar a usar (oficial, bolsa, blue, contadoconliqui, mayorista, tarjeta)
      - key: USD_ARS_CASA
        value: oficial
      # Opcional: fijar la cotización a mano (pisa la cotización en vivo). Dejar vacío para usar la automática.
      # - key: USD_ARS_RATE_OVERRIDE
      #   value: "1500"
